<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's in my Pantry?</title>
    <script src="/freezer/dabus.js"></script>
    <script src="/freezer/api.js"></script>
    <style>
        body {
            background-color: #252525;
            text-color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            touch-action: none;
        }
        #cropCanvas {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .ui-overlay {
            z-index: 1;
        }
        .controls button {
            margin: 5px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            background-color: #909090;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="scanBtn">Start Barcode Scan</button>
        <button id="captureBtn">Start Camera for Picture</button>
    </div>

    <button id="captureFrameBtn" class="ui-overlay" style="position:absolute;top:80%;left:45%;right:55%;bottom:90%;display:none;">Capture Frame</button>
    <button id="cropBtn" class="ui-overlay" style="position:absolute;top:80%;left:45%;right:55%;bottom:90%;display:none;">Crop &amp; Save</button>
    <video id="video" playsinline autoplay></video>
    <canvas id="detectionCanvas" style="ui-overlay; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
    <canvas id="cropCanvas" style="ui-overlay; position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const captureBtn = document.getElementById('captureBtn');
        const captureFrameBtn = document.getElementById('captureFrameBtn');
        const cropBtn = document.getElementById('cropBtn');
        const video = document.getElementById('video');
        const detectionCanvas = document.getElementById('detectionCanvas');
        const detectionCtx = detectionCanvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const ctx = cropCanvas.getContext('2d');

        const offscreenCanvas = document.createElement('canvas');
        const offscreenCtx = offscreenCanvas.getContext('2d');

        let barcodeDetectorOn = false;

        let currentUPC = null;

        let stream;
        let isDrawing = false;
        let startX, startY;
        let selection = { x: 0, y: 0, w: 0, h: 0 };
        let detectedBarcodes = [];

        let messages = [];
        let freezerDb = {};
        let currentSection = '';

        resetUI();

        function resetUI() {
            barcodeDetectorOn = false;
            video.style.display = 'none';
            cropCanvas.style.display = 'none';
            detectionCanvas.style.display = 'none';
            detectionCanvas.style.pointerEvents = 'none';
            captureFrameBtn.style.display = 'none';
            cropBtn.style.display = 'none';
            offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.heigh );
            detectionCtx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            detectedBarcodes = [];
        }

        function resetButtons() {
            scanBtn.disabled = false;
            captureBtn.disabled = false;
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function drawDetectionBoxes() {
            detectionCanvas.width = offscreenCanvas.width;
            detectionCanvas.height = offscreenCanvas.height;
            detectionCtx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            detectionCtx.drawImage(offscreenCanvas, 0, 0, detectionCanvas.width, detectionCanvas.height);
            detectionCtx.strokeStyle = 'red';
            detectionCtx.lineWidth = 3;

            detectedBarcodes.forEach(barcode => {
                const boundingBox = barcode.boundingBox;
                detectionCtx.strokeRect(boundingBox.x, boundingBox.y, boundingBox.width, boundingBox.height);
            });
        }

        async function startScanner() {
            resetUI();
            barcodeDetectorOn = true;
            video.style.display = 'block';
            detectionCanvas.style.display = 'block';
            detectionCanvas.style.pointerEvents = 'auto';
            currentUPC = null;

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;

                var detector = null;

                try {
                    detector = new BarcodeDetector();
                } catch (e) {
                    logServer( e.message );
                }

                async function detectBarcodes() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        offscreenCanvas.width = video.videoWidth;
                        offscreenCanvas.height = video.videoHeight;
                        offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                        
                        if( detector ) {
                            const barcodes = await detector.detect(video);
                            if( barcodes.length > 0 ) {
                                detectedBarcodes = barcodes;
                            }
                        }
                    }
                    drawDetectionBoxes();
                    if( barcodeDetectorOn ) requestAnimationFrame(detectBarcodes);
                }

                video.onplay = () => {
                    detectBarcodes();
                };

                detectionCanvas.addEventListener('click', (e) => {
                    const coords = getPointerCoords(e, detectionCanvas);
                    const clickedBarcode = detectedBarcodes.find(barcode => {
                        const { x, y, width, height } = barcode.boundingBox;
                        return coords.x >= x && coords.x <= x + width &&
                               coords.y >= y && coords.y <= y + height;
                    });

                    if (clickedBarcode) {
                        currentUPC = clickedBarcode.rawValue;
                        stopCamera();
                        resetButtons();
                        resetUI();
                    }
                });

            } catch (err) {
                logServer("Error: ", err);
                stopCamera();
                resetButtons();
            }
        }

        async function startCapture() {
            resetUI();
            video.style.display = 'block';
            captureFrameBtn.style.display = 'block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                logServer("Error: ", err);
                stopCamera();
                resetButtons();
                resetUI();
            }
        }

        function captureFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                offscreenCanvas.width = video.videoWidth;
                offscreenCanvas.height = video.videoHeight;
                offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

                const scale = Math.min(1024 / offscreenCanvas.width, 1024 / offscreenCanvas.height, 1);
                cropCanvas.width = offscreenCanvas.width * scale;
                cropCanvas.height = offscreenCanvas.height * scale;
                
                ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);

                video.style.display = 'none';
                captureFrameBtn.style.display = 'none';
                cropCanvas.style.display = 'block';
                cropBtn.style.display = 'block';
                
                stopCamera();
            }
        }

        function getPointerCoords(e, targetCanvas) {
            const rect_canvas = targetCanvas.getBoundingClientRect();
            const scaleX = targetCanvas.width / rect_canvas.width;
            const scaleY = targetCanvas.height / rect_canvas.height;
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect_canvas.left) * scaleX,
                y: (clientY - rect_canvas.top) * scaleY
            };
        }

        function handleStart(e) {
            const coords = getPointerCoords(e, cropCanvas);
            startX = coords.x;
            startY = coords.y;
            isDrawing = true;
            selection = { x: startX, y: startY, w: 0, h: 0 };
        }

        function handleMove(e) {
            if (!isDrawing) return;
            if (e.touches && e.touches.length > 0) e.preventDefault();

            const coords = getPointerCoords(e, cropCanvas);
            const currentX = coords.x;
            const currentY = coords.y;

            selection.w = currentX - startX;
            selection.h = currentY - startY;
            selection.x = startX;
            selection.y = startY;

            ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(selection.x, selection.y, selection.w, selection.h);
            ctx.restore();
            
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
        }

        function handleEnd() {
            isDrawing = false;
        }

        cropCanvas.addEventListener('mousedown', handleStart);
        cropCanvas.addEventListener('mousemove', handleMove);
        cropCanvas.addEventListener('mouseup', handleEnd);

        cropCanvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, {passive: false});
        cropCanvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }, {passive: false});
        cropCanvas.addEventListener('touchend', handleEnd);

        let pushMode = 'image';

        async function cropAndSave() {
            const scale = cropCanvas.width / offscreenCanvas.width;
            
            const realX = selection.x / scale;
            const realY = selection.y / scale;
            const realW = selection.w / scale;
            const realH = selection.h / scale;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = Math.abs(realW);
            tempCanvas.height = Math.abs(realH);
            const tempCtx = tempCanvas.getContext('2d');
            
            const sx = realW < 0 ? realX + realW : realX;
            const sy = realH < 0 ? realY + realH : realY;
            const sw = Math.abs(realW);
            const sh = Math.abs(realH);

            tempCtx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
            
            const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/jpeg'));
            const arrayBuffer = await blob.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);

            var response = await fetch('/freezer/api/put' + putMode + '/' + currentUPC,{method:'POST',body:blob});
            
            resetUI();
            resetButtons();
        }

        scanBtn.addEventListener('click', startScanner);
        captureBtn.addEventListener('click', startCapture);
        captureFrameBtn.addEventListener('click', captureFrame);
        cropBtn.addEventListener('click', cropAndSave);

    </script>
</body>
</html>
