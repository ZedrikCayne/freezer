<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height">
    <title>What's in my Pantry?</title>
    <style>
         body {
              background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
              color: white;
              font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
             display: flex;
             flex-direction: column;
             align-items: center;
             justify-content: center;
             min-height: 100vh;
             margin: 0;
             padding: 20px;
          }
         ::-webkit-scrollbar {
             width: 8px;
         }
         ::-webkit-scrollbar-track {
             background: rgba(0, 0, 0, 0.2);
             border-radius: 4px;
         }
         ::-webkit-scrollbar-thumb {
             background: rgba(108, 99, 255, 0.5);
             border-radius: 4px;
         }
         ::-webkit-scrollbar-thumb:hover {
             background: rgba(108, 99, 255, 0.7);
         }
         #video {
             position: absolute;
             width: 100%;
             height: 100%;
             object-fit: contain;
             border: none;
             touch-action: none;
         }
         #cropCanvas {
             width: 100%;
             height: 100%;
             object-fit: contain;
             border: none;
             display: none;
             cursor: crosshair;
             object-fit: contain;
             touch-action: none;
         }
         .controls {
             display: block;
             margin-bottom: 20px;
             text-align: center;
         }
         .ui-overlay {
             z-index: 1;
         }
         .controls button {
             margin: 5px;
         }
         input {
             padding: 10px;
             font-size: 16px;
             width: 250px;
             margin-bottom: 10px;
         }
         button {
             background: linear-gradient(145deg, #6c63ff, #4834d4);
             color: white;
             padding: 12px 28px;
             font-size: 18px;
             font-weight: 600;
             border: none;
             border-radius: 10px;
             cursor: pointer;
             box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
             transition: all 0.2s ease;
         }
         button:hover {
             background: linear-gradient(145deg, #7b73ff, #5a45e0);
             box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
             transform: translateY(-1px);
         }
         button:active {
             transform: translateY(1px);
             box-shadow: 0 2px 8px rgba(108, 99, 255, 0.3);
         }
         button:disabled {
             background: #444;
             box-shadow: none;
             cursor: not-allowed;
             transform: none;
         }
        .overlaycontainer {
             display: block;
             position: absolute;
             top: 0%;
             left: 0%;
             width: 100%;
             height: 85%;
             overflow-x: hidden;
             overflow-y: auto;
             background: rgba(22, 33, 62, 0.95);
             backdrop-filter: blur(10px);
         }
        .squareholder {
            display: grid;
            grid-template-columns: 50% 50%;
            position:absolute;
            top: 15%;
            left: 0%;
            width: 100%;
            height: 85%;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .squareitem {
            position: relative;
            width: 100%;
            padding: 5px;
            aspect-ratio: 1 / 1;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            container-type: size;
            box-sizing: border-box;
        }
        .squareitemnum {
            position: absolute;
            right: 4px;
            top: 4px;
            width: 30cqi;
            aspect-ratio: 1 / 1;
            text-align: center;
            container-type: size;
            font-size: 20cqi;
            font-weight: 800;
            line-height: 1;
            color: #fff;
            background: rgba(108, 99, 255, 0.92);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .zoombuttons {
             width: 100%;
             display: flex;
             flex-direction: row;
             aspect-ratio: 6 / 1;
             overflow: hidden;
             container-type: size;
             padding: 8px;
             gap: 6px;
             box-sizing: border-box;
             background: rgba(0, 0, 0, 0.3);
         }
         .abutton {
             text-align: center;
             font-size: 7cqw;
             line-height: 1;
             width: 20%;
             aspect-ratio: 1 / 1;
             display: flex;
             align-items: center;
             justify-content: center;
             border-radius: 10px;
             font-weight: 700;
             color: white;
             box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
             transition: transform 0.15s ease, filter 0.15s ease;
             cursor: pointer;
             user-select: none;
         }
         .abutton:hover {
             transform: scale(1.08);
             filter: brightness(1.2);
         }
         .abutton:active {
             transform: scale(0.95);
         }
    </style>
</head>
<body>
    <div id="mainCtrl" class="controls" style="flex-direction:horizontal;position:absolute;top:0%;left:0%;width:100%;height:15%;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);align-items:center;justify-content:center">
        <button id="scanBtn">Scan To Add</button>
        <!--button id="captureBtn" onClick="beepLowLow()">beep</button-->
    </div>
    <div id="fill" class="squareholder">
    </div>
    <div id="productOverlay" class="overlaycontainer" style="display:hidden;">
        <div class='zoombuttons' >
            <div class="abutton" onClick="addOne()" style="background-color:green">+</div>
            <div class="abutton" onClick="subOne()" style="background-color:blue">-</div>
            <div class="abutton" onClick="captureImage()" style="background-color:gray">C</div>
            <div class="abutton" onClick="captureInfo()" style="background-color:darkgray">I</div>
            <div class="abutton" onClick="captureNutrition()" style="background-color:gray">N</div>
            <div class="abutton" onClick="cancelButton()" style="background-color:red">x</div>
        </div>
        <div id="fillOverlay">
        </div>
    </div>

    <button id="cancelBtn" classs="ui-overlay" style="color:white;background-color:#FF0000;z-index:2;position:absolute;top:0%;left:80%;width:20%;aspect-ratio: 1 / 1;display:none;">X</button>
    <button id="captureFrameBtn" class="ui-overlay" style="background-color:red;position:absolute;top:80%;left:45%;width:10%;aspect-ratio: 1 / 1;display:none;"></button>
    <button id="cropBtn" class="ui-overlay" style="background-color:green;position:absolute;top:80%;left:45%;width:10%;aspect-ratio: 1 / 1;display:none;"></button>
    <video id="video" playsinline autoplay></video>
     <canvas id="detectionCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
     <canvas id="cropCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>

    <script>
        const audioContext = {"ac":null,"osc":null};
        const mainCtrl = document.getElementById('mainCtrl');
        const cancelBtn = document.getElementById('cancelBtn');
        const scanBtn = document.getElementById('scanBtn');
        const captureFrameBtn = document.getElementById('captureFrameBtn');
        const cropBtn = document.getElementById('cropBtn');
        const video = document.getElementById('video');
        const detectionCanvas = document.getElementById('detectionCanvas');
        const detectionCtx = detectionCanvas.getContext('2d');
        const cropCanvas = document.getElementById('cropCanvas');
        const ctx = cropCanvas.getContext('2d');
        const productOverlay = document.getElementById('productOverlay');
        const fillOverlay = document.getElementById('fillOverlay');

        const fillMe = document.getElementById('fill');

        const offscreenCanvas = document.createElement('canvas');
        const offscreenCtx = offscreenCanvas.getContext('2d');
        let addOneAfterPicture = false;

        let barcodeDetectorOn = false;

        let currentUPC = null;

        let stream;
        let isDrawing = false;
        let startX, startY;
        let selection = { x: 0, y: 0, w: 0, h: 0 };
        let detectedBarcodes = [];

        let messages = [];
        let freezerDb = {};
        let currentSection = '';

        let wasScanning = false;
        let overviewUpc = '';

        resetUI();

        function resetUI() {
            overviewUpc = '';
            cancelBtn.style.display = 'none';
            barcodeDetectorOn = false;
            video.style.display = 'none';
            cropCanvas.style.display = 'none';
            detectionCanvas.style.display = 'none';
            detectionCanvas.style.pointerEvents = 'none';
            captureFrameBtn.style.display = 'none';
            productOverlay.style.display = 'none';
            cropBtn.style.display = 'none';
            offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.heigh );
            detectionCtx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            fillMe.style.display = 'grid';
            mainCtrl.style.display = 'block';
            detectedBarcodes = [];
        }

        function resetButtons() {
            scanBtn.disabled = false;
            cancelBtn.disabled = true;
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function logServer(what) {
            ServerApi.api_logbody(what);
        }

        function drawDetectionBoxes() {
            detectionCanvas.width = offscreenCanvas.width;
            detectionCanvas.height = offscreenCanvas.height;
            detectionCtx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            detectionCtx.drawImage(offscreenCanvas, 0, 0, detectionCanvas.width, detectionCanvas.height);
            detectionCtx.strokeStyle = 'red';
            detectionCtx.lineWidth = 3;

            detectedBarcodes.forEach(barcode => {
                const boundingBox = barcode.boundingBox;
                detectionCtx.strokeRect(boundingBox.x, boundingBox.y, boundingBox.width, boundingBox.height);
            });
        }

         async function startScanner() {
             resetUI();
             wasScanning = true;
             cancelBtn.disabled = false;
             cancelBtn.style.display = 'block';
             barcodeDetectorOn = true;
             scanBtn.disabled = true;
             detectionCanvas.style.display = 'block';
             detectionCanvas.style.pointerEvents = 'auto';

            currentUPC = null;

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;

                var detector = null;

                try {
                    detector = new BarcodeDetector();
                } catch (e) {
                    detectedBarcodes = [ {rawValue:"1",boundingBox:{x:0,y:0,width:100,height:100}} ];
                    logServer( e.message );
                }

                async function detectBarcodes() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        offscreenCanvas.width = video.videoWidth;
                        offscreenCanvas.height = video.videoHeight;
                        offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                        
                        if( detector ) {
                            const barcodes = await detector.detect(video);
                            if( barcodes.length > 0 ) {
                                detectedBarcodes = barcodes;
                            }
                        }
                    }
                    drawDetectionBoxes();
                    if( barcodeDetectorOn ) requestAnimationFrame(detectBarcodes);
                }

                video.onplay = () => {
                    if( barcodeDetectorOn ) detectBarcodes();
                };

                detectionCanvas.addEventListener('click', (e) => {
                    const coords = getPointerCoords(e, detectionCanvas);
                    const clickedBarcode = detectedBarcodes.find(barcode => {
                        const { x, y, width, height } = barcode.boundingBox;
                        return coords.x >= x && coords.x <= x + width &&
                               coords.y >= y && coords.y <= y + height;
                    });

                    if (clickedBarcode) {
                        currentUPC = clickedBarcode.rawValue;
                        ServerApi.api_item_add( currentUPC ).then( response => {
                            switch( response.status ) {
                                case 200:
                                    beepHi();
                                    //Okay.
                                break;
                                case 400:
                                    //Bad upc..
                                    beepHiLow();
                                break;
                                case 404:
                                    //Missing product, upload then add.
                                    beepLowLow();
                                    pushMode = 'image';
                                    addOneAfterPicture = true;
                                    startCapture();
                                break;
                                default:
                                    beepLow();
                                    stopCamera();
                                    resetButtons();
                                    resetUI();
                                    alert("Error posting picture...try again later.");
                            }
                        } );
                    }
                });

            } catch (err) {
                logServer("Error: ", err);
                stopCamera();
                resetButtons();
            }
        }

        async function captureImage() {
            currentUPC = overviewUpc;
            pushMode = 'image';
            startCapture();
        }

        async function captureInfo() {
            currentUPC = overviewUpc;
            pushMode = 'info';
            startCapture();
        }

        async function captureNutrition() {
            currentUPC = overviewUpc;
            pushMode = 'nutrition';
            startCapture();
        }

        async function startCapture() {
            resetUI();
            cancelBtn.disabled = false;
            cancelBtn.style.display = 'block';
            scanBtn.disabled = true;
            video.style.display = 'block';
            captureFrameBtn.style.display = 'block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                logServer("Error: ", err);
                stopCamera();
                resetButtons();
                resetUI();
            }
        }

        function captureFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                offscreenCanvas.width = video.videoWidth;
                offscreenCanvas.height = video.videoHeight;
                offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

                const scale = Math.min(512 / offscreenCanvas.width, 512 / offscreenCanvas.height, 1);
                cropCanvas.width = offscreenCanvas.width * scale;
                cropCanvas.height = offscreenCanvas.height * scale;
                
                ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);

                video.style.display = 'none';
                captureFrameBtn.style.display = 'none';
                cropCanvas.style.display = 'block';
                cropBtn.style.display = 'block';
                
                stopCamera();
            }
        }

        function getPointerCoords(e, targetCanvas) {
            const rect_canvas = targetCanvas.getBoundingClientRect();
            const scaleX = targetCanvas.width / rect_canvas.width;
            const scaleY = targetCanvas.height / rect_canvas.height;
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect_canvas.left) * scaleX,
                y: (clientY - rect_canvas.top) * scaleY
            };
        }

        function handleStart(e) {
            const coords = getPointerCoords(e, cropCanvas);
            startX = coords.x;
            startY = coords.y;
            isDrawing = true;
            selection = { x: startX, y: startY, w: 0, h: 0 };
        }

        function handleMove(e) {
            if (!isDrawing) return;
            if (e.touches && e.touches.length > 0) e.preventDefault();

            const coords = getPointerCoords(e, cropCanvas);
            const currentX = coords.x;
            const currentY = coords.y;

            selection.w = currentX - startX;
            selection.h = currentY - startY;
            selection.x = startX;
            selection.y = startY;

            ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            //ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(selection.x, selection.y, selection.w, selection.h);
            ctx.restore();
            
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
        }

        function handleEnd() {
            isDrawing = false;
        }

        cropCanvas.addEventListener('mousedown', handleStart);
        cropCanvas.addEventListener('mousemove', handleMove);
        cropCanvas.addEventListener('mouseup', handleEnd);

        cropCanvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, {passive: false});
        cropCanvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }, {passive: false});
        cropCanvas.addEventListener('touchend', handleEnd);

        let pushMode = 'image';


        async function uploadImage() {
            const scale = cropCanvas.width / offscreenCanvas.width;
            
            const realX = selection.x / scale;
            const realY = selection.y / scale;
            const realW = selection.w / scale;
            const realH = selection.h / scale;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = Math.abs(realW);
            tempCanvas.height = Math.abs(realH);
            const tempCtx = tempCanvas.getContext('2d');
            
            const sx = realW < 0 ? realX + realW : realX;
            const sy = realH < 0 ? realY + realH : realY;
            const sw = Math.abs(realW);
            const sh = Math.abs(realH);

            tempCtx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
            
            if( currentUPC !== null ) {
                const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/jpeg'));
                const arrayBuffer = await blob.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);

                var promise = null;

                switch(pushMode) {
                    case "image":
                        promise = ServerApi.api_product_putimage( currentUPC, blob );
                        break;
                    case "nutrition":
                        promise = ServerApi.api_product_putnutrition( currentUPC, blob );
                        break;
                    case "info":
                        promise = ServerApi.api_product_putinfo( currentUPC, blob );
                        break;
                }
                if( promise ) promise.then( result => {
                    if( result.ok ) {
                        if( addOneAfterPicture ) {
                            ServerApi.api_item_add(currentUPC).then( response => {
                                if( !response.ok ) {
                                    beepLow();
                                } else {
                                    beepHi();
                                }
                            } );
                            addOneAfterPicture = false;
                        }
                        startScanner();
                    } else {
                        beepLowLow();
                        resetUI();
                        resetButtons();
                        alert("Failed to upload photo. Try again later.");
                    }
                } );
            }
            
        }

        async function cancelButton() {
            wasScanning = false;
            stopCamera();
            resetUI();
            resetButtons();
        }


        function beepHi() {
            audioContext.hiGain.gain.setValueAtTime( 1, audioContext.ac.currentTime);
            audioContext.hiGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.05);
        }

        function beepHiLow() {
            audioContext.hiGain.gain.setValueAtTime( 1, audioContext.ac.currentTime);
            audioContext.hiGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.05);
            audioContext.loGain.gain.setValueAtTime( 1, audioContext.ac.currentTime + 0.10);
            audioContext.loGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.15);
        }

        function beepLow() {
            audioContext.loGain.gain.setValueAtTime( 1, audioContext.ac.currentTime);
            audioContext.loGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.05);
        }

        function beepLowLow() {
            audioContext.loGain.gain.setValueAtTime( 1, audioContext.ac.currentTime);
            audioContext.loGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.05);
            audioContext.loGain.gain.setValueAtTime( 1, audioContext.ac.currentTime + 0.10);
            audioContext.loGain.gain.setValueAtTime( 0, audioContext.ac.currentTime + 0.15);
        }

        function initAudio() {
            if( audioContext.ac !== null ) {
                audioContext.ac.close();
                audioContext.ac = null;
            }
            let ac = new AudioContext();
            audioContext.ac = ac;
            audioContext.hiOsc = ac.createOscillator();
            audioContext.hiOsc.frequency.setValueAtTime(1760,0);
            audioContext.hiOsc.start(0);
            audioContext.hiGain = ac.createGain();
            audioContext.hiGain.gain.setValueAtTime(0,0);
            audioContext.hiOsc.connect(audioContext.hiGain).connect(ac.destination);
            audioContext.loOsc = ac.createOscillator();
            audioContext.loOsc.frequency.setValueAtTime(880,0);
            audioContext.loOsc.start(0);
            audioContext.loGain = ac.createGain();
            audioContext.loGain.gain.setValueAtTime(0,0);
            audioContext.loOsc.connect(audioContext.loGain).connect(ac.destination);
        }

        cancelBtn.addEventListener('click', cancelButton);
        scanBtn.addEventListener('click', startScanner);
        captureFrameBtn.addEventListener('click', captureFrame);
        cropBtn.addEventListener('click', uploadImage );
        //captureBtn.addEventListener('click', testUploadInfo );
        
        async function grabState() {
            ServerApi.api_state().then(response => { gotState(response) });
        }

        const busty = "0123456789AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz";
        function cbust() {
            var bustString = "";
            for( var i = 0; i < 10; ++i ) {
                bustString = bustString + busty[ Math.floor((Math.random() * 36)) ];
            }
            return bustString;
        }

        async function stuffImage( uri, div ) {
            setTimeout( stuffImageReal, Math.floor(Math.random() * 200) + 250, uri, div );
        }

        let currentStuffQueue = 0;

        async function stuffImageReal( uri, div ) {
            try {
                if( currentStuffQueue > 4 ) {
                    stuffImage( uri, div );
                } else {
                    ++currentStuffQueue;
                    var response = await fetch(uri + "?cb=" + cbust());
                    --currentStuffQueue;
                    if( response.ok ) {
                        var blob = await response.blob();
                        div.style.backgroundImage = "url( " + URL.createObjectURL(blob)+ " )";
                    } else {
                        if( response.status != 404 ) {
                            stuffImage( uri, div );
                        } else {
                        }
                    }
                }
            } catch (e) {
                --currentStuffQueue;
                stuffImage( uri, div );
            }
        }

        async function changeNumber( upc, howmuch ) {
            var div = document.getElementById( "details_num_" + upc );
            if( div ) {
                var newNumber = Number(div.innerText) + howmuch;
                if( newNumber >= 0 ) div.innerText = newNumber;
            }
            div = document.getElementById( "num_" + upc );
            if( div ) {
                var newNumber = Number(div.innerText) + howmuch;
                if( newNumber >= 0 ) div.innerText = newNumber;
            } else {

            }
        }

        async function addOne() {
            var response = await ServerApi.api_item_add( overviewUpc );
            if( response.ok ) {
                beepHi();
                changeNumber( overviewUpc, 1 );
            } else {
                beepLow();
            }
        }
        async function subOne() {
            var response = await ServerApi.api_item_remove( overviewUpc );
            if( response.ok ) {
                beepHi();
                changeNumber( overviewUpc, -1 );
            } else {
                beepLow();
            }
        }

        async function openDetails( aThing ) {
            var target = aThing.currentTarget;
            resetUI();
            overviewUpc = target.upc;
            fillMe.style.display = 'none';
            mainCtrl.style.display = 'none';
            productOverlay.style.display = 'block';
            fillOverlay.innerHTML = '';
            var newDiv = newSquare( target.image, target.num, "details_num_" + target.upc );
            fillOverlay.appendChild(newDiv);
            newDiv = newSquare( target.info );
            fillOverlay.appendChild(newDiv);
            newDiv = newSquare( target.nutrition );
            fillOverlay.appendChild(newDiv);
        }

        function newSquare( imageUrl, num, idForNumber ) {
            var newDiv = document.createElement("div");
            newDiv.className='squareitem';
            if( !(imageUrl === null || imageUrl === undefined) ) {
                stuffImage( imageUrl, newDiv );
            }
            if( !(num === null || num === undefined ) ) {
                var aNum = document.createElement("div");
                aNum.className = 'squareitemnum';
                aNum.innerText = num;
                if( !(idForNumber === null || idForNumber === undefined) ) {
                    aNum.id = idForNumber;
                }
                newDiv.appendChild(aNum);
            }
            return newDiv;
        }

        async function gotState( response ) {
            if( response.ok ) {
                var stateStuff = await response.json();
                var currentSectionId = null;
                var aSection;
                var length = stateStuff.sections.length;
                for( i = 0; i < length; i++ ) {
                    if( stateStuff.sections[i].current ) {
                        currentSectionId = stateStuff.sections[i].sectionId;
                        break;
                    }
                }
                if( currentSectionId == null ) {
                    grabState();
                } else {
                    var sectionContents = stateStuff.section_contents[ currentSectionId ];
                    sectionContents.forEach(anItem => {
                        var newDiv = newSquare( stateStuff.itemdb[anItem.upc].image, anItem.num, "num_" + anItem.upc );
                        newDiv.id = "upc_" + anItem.upc;
                        newDiv.upc = anItem.upc;
                        newDiv.num = anItem.num;
                        newDiv.image = stateStuff.itemdb[anItem.upc].image;
                        newDiv.info = stateStuff.itemdb[anItem.upc].info;
                        newDiv.nutrition = stateStuff.itemdb[anItem.upc].nutrition;
                        newDiv.onclick = openDetails;
                        fillMe.appendChild(newDiv);
                     } );
                }
            } else {
                grabState();
            }
        }

        async function loadApi() {
            while( true ) {
                try {
                    var response = await fetch("/freezer/api.js");
                    if( response.ok ) {
                        var scriptDiv = document.createElement('script');
                        scriptDiv.innerHTML = await response.text();
                        document.head.appendChild(scriptDiv);
                        ServerApi.api_state().then(response => { gotState(response) });
                        return;
                    } else {
                        alert("Failed to load the api...reload the page please.");
                    }
                } catch (e) {
                    setTimeout( loadApi, 100 );
                }
            }
        }

        window.onload = function() {
            initAudio();
            loadApi();
        };

    </script>
</body>
</html>
