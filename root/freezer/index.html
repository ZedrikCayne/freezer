<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner & Image Cropper</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #video {
            width: 100%;
            max-width: 500px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
        #cropCanvas {
            width: 100%;
            max-width: 500px;
            border: 1px solid #ccc;
            margin-top: 20px;
            display: none;
            cursor: crosshair;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls button {
            margin: 5px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="scanBtn">Start Barcode Scan</button>
        <button id="captureBtn">Start Camera for Picture</button>
        <button id="captureFrameBtn" style="display:none;">Capture Frame</button>
        <button id="cropBtn" style="display:none;">Crop & Save</button>
    </div>

    <input type="text" id="barcodeResult" placeholder="Barcode value will appear here" readonly>
    <p id="supportedFormats" style="font-int-size: 12px; color: #666; text-align: center; margin-top: 10px;"></p>

    <video id="video" autoplay playsinline></video>
    <canvas id="cropCanvas"></canvas>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const captureBtn = document.getElementById('captureBtn');
        const captureFrameBtn = document.getElementById('captureFrameBtn');
        const cropBtn = document.getElementById('cropBtn');
        const video = document.getElementById('video');
        const cropCanvas = document.getElementById('cropCanvas');
        const barcodeResultActual = document.getElementById('barcodeResult');
        const supportedFormatsText = document.getElementById('supportedFormats');
        const ctx = cropCanvas.getContext('2d');

        const offscreenCanvas = document.createElement('canvas');
        const offscreenCtx = offscreenCanvas.getContext('2d');

        let stream;
        let isDrawing = false;
        let startX, startY;
        let selection = { x: 0, y: 0, w: 0, h: 0 };

        if ('BarcodeDetector' in window) {
            BarcodeDetector.getSupportedFormats().then(formats => {
                supportedFormatsText.textContent = "Supported formats: " + formats.join(', ');
            }).catch(err => {
                supportedFormatsText.textContent = "Error loading formats: " + err.message;
            });
        } else {
            supportedFormatsText.textContent = "Barcode Detector API not supported in this browser.";
        }

        function resetUI() {
            video.style.display = 'none';
            cropCanvas.style.display = 'none';
            captureFrameBtn.style.display = 'none';
            cropBtn.style.display = 'none';
        }

        function resetButtons() {
            scanBtn.disabled = false;
            captureBtn.disabled = false;
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        async function startScanner() {
            resetUI();
            video.style.display = 'block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;

                const detector = new BarcodeDetector();

                async function detectBarcodes() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        const barcodes = await detector.detect(video);
                        if (barcodes.length > 0) {
                            barcodeResultActual.value = barcodes[0].rawValue;
                            stopCamera();
                            resetButtons();
                            return;
                        }
                    }
                    requestAnimationFrame(detectBarcodes);
                }

                video.onplay = () => {
                    detectBarcodes();
                };

            } catch (err) {
                console.error("Error: ", err);
                alert("Error: " + err.message);
                stopCamera();
                resetButtons();
            }
        }

        async function startCapture() {
            resetUI();
            video.style.display = 'block';
            captureFrameBtn.style.display = 'inline-block';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error: ", err);
                alert("Error: " + err.message);
                stopCamera();
                resetButtons();
            }
        }

        function captureFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                offscreenCanvas.width = video.videoWidth;
                offscreenCanvas.height = video.videoHeight;
                offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

                const scale = Math.min(500 / offscreenCanvas.width, 500 / offscreenCanvas.height, 1);
                cropCanvas.width = offscreenCanvas.width * scale;
                cropCanvas.height = offscreenCanvas.height * scale;
                
                ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);

                video.style.display = 'none';
                captureFrameBtn.style.display = 'none';
                cropCanvas.style.display = 'block';
                cropBtn.style.display = 'inline-block';
                
                stopCamera();
            }
        }

        cropCanvas.addEventListener('mousedown', (e) => {
            const rect_canvas = cropCanvas.getBoundingClientRect();
            const scaleX = cropCanvas.width / rect_canvas.width;
            const scaleY = cropCanvas.height / rect_canvas.height;
            startX = (e.clientX - rect_canvas.left) * scaleX;
            startY = (e.clientY - rect_canvas.top) * scaleY;
            isDrawing = true;
            selection = { x: startX, y: startY, w: 0, h: 0 };
        });

        cropCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect_canvas = cropCanvas.getBoundingClientRect();
            const scaleX = cropCanvas.width / rect_canvas.width;
            const scaleY = cropCanvas.height / rect_canvas.height;
            const currentX = (e.clientX - rect_canvas.left) * scaleX;
            const currentY = (e.clientY - rect_canvas.top) * scaleY;

            selection.w = currentX - startX;
            selection.h = currentY - startY;
            selection.x = startX;
            selection.y = startY;

            ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(selection.x, selection.y, selection.w, selection.h);
            ctx.restore();
            
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
        });

        cropCanvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        async function cropAndSave() {
            const scale = cropCanvas.width / offscreenCanvas.width;
            
            const realX = selection.x / scale;
            const realY = selection.y / scale;
            const realW = selection.w / scale;
            const realH = selection.h / scale;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = Math.abs(realW);
            tempCanvas.height = Math.abs(realH);
            const tempCtx = tempCanvas.getContext('2d');
            
            const sx = realW < 0 ? realX + realW : realX;
            const sy = realH < 0 ? realY + realH : realY;
            const sw = Math.abs(realW);
            const sh = Math.abs(realH);

            tempCtx.drawImage(offscreenCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
            
            const blob = await new Promise(resolve => tempCanvas.toBlob(resolve, 'image/png'));
            const arrayBuffer = await blob.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            
            console.log("Cropped image byte array:", uint8Array);
            alert("Cropped image saved to console as Uint8Array. Length: " + uint8Array.length);
            
            resetUI();
            resetButtons();
        }

        scanBtn.addEventListener('click', startScanner);
        captureBtn.addEventListener('click', startCapture);
        captureFrameBtn.addEventListener('click', captureFrame);
        cropBtn.addEventListener('click', cropAndSave);

    </script>
</body>
</html>
